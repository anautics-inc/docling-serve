kind: Deployment
apiVersion: apps/v1
metadata:
  name: docling-serve
  labels:
    app: docling-serve
    component: docling-serve-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling-serve
      component: docling-serve-api
  template:
    metadata:
      labels:
        app: docling-serve
        component: docling-serve-api
    spec:
      restartPolicy: Always
      serviceAccountName: docling-serve-api
      containers:
        - name: api
          resources:
            limits:
              cpu: 2
              memory: 4Gi
              ephemeral-storage: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
              ephemeral-storage: 1Gi
          env:
            - name: DOCLING_SERVE_UPLOAD_STAGING_MODE
              value: required
            - name: DOCLING_SERVE_UPLOAD_STAGING_BUCKET
              value: DOCLING_STAGING_BUCKET_PLACEHOLDER
            - name: DOCLING_SERVE_UPLOAD_STAGING_REGION
              value: DOCLING_STAGING_REGION_PLACEHOLDER
            - name: DOCLING_SERVE_UPLOAD_STAGING_KMS_KEY_ID
              value: DOCLING_STAGING_KMS_KEY_PLACEHOLDER
            - name: DOCLING_SERVE_ENABLE_UI
              value: 'true'
            - name: DOCLING_SERVE_ARTIFACTS_PATH
              value: '/modelcache'
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          imagePullPolicy: IfNotPresent
          # Render with scripts/render_deploy_example.py before applying.
          image: 'DOCLING_SERVE_IMAGE_PLACEHOLDER'
          volumeMounts:
            - name: docling-model-cache
              mountPath: /modelcache
      volumes:
        - name: docling-model-cache
          persistentVolumeClaim:
            claimName: docling-model-cache-pvc