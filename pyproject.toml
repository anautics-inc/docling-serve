[project]
name = "docling-serve"
version = "1.26.0"  # DO NOT EDIT, updated automatically
description = "Running Docling as a service"
license = {text = "MIT"}
authors = [
    {name="Michele Dolfi", email="dol@zurich.ibm.com"},
    {name="Guillaume Moutier", email="gmoutier@redhat.com"},
    {name="Anil Vishnoi", email="avishnoi@redhat.com"},
    {name="Panos Vagenas", email="pva@zurich.ibm.com"},
    {name="Christoph Auer", email="cau@zurich.ibm.com"},
    {name="Peter Staar", email="taa@zurich.ibm.com"},
]
maintainers = [
    {name="Michele Dolfi", email="dol@zurich.ibm.com"},
    {name="Anil Vishnoi", email="avishnoi@redhat.com"},
    {name="Panos Vagenas", email="pva@zurich.ibm.com"},
    {name="Christoph Auer", email="cau@zurich.ibm.com"},
    {name="Peter Staar", email="taa@zurich.ibm.com"},
]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "docling-slim[standard,service-client,models-remote]>=2.114.0,<3.0.0",
    # chunking-openai brings the OpenAI/tiktoken tokenizer docling-graph imports.
    "docling-core[chunking,chunking-openai]>=2.87.1",
    "docling-jobkit[rq,ray,vlm]>=2.1.0,<3.0.0",
    # Knowledge-graph extraction (NER replacement) backing POST /v1/graph/extract.
    # docling-graph declares a dependency on the FULL `docling` distribution, but it only
    # needs the `docling` import namespace (which docling-slim provides) + docling-core
    # chunking. We exclude full `docling` via a uv override below so it cannot conflict with
    # the `docling-slim` that docling-jobkit requires (both own the `docling/` package).
    "docling-graph>=1.9.1,<2.0.0",
    # Schematic extraction: PDF/Office parsing + skeleton-based wire vectorization (cv2
    # arrives via the OCR stack) and the secure XML parser KiCad export uses.
    "python-pptx>=1.0.0,<2.0.0",
    "scikit-image>=0.24",
    "defusedxml>=0.7.1,<0.8.0",
    # AccessDB extraction: pure-Python Jet/ACE reader (no ODBC, no mdbtools CLI).
    "access-parser>=0.0.6,<0.1.0",
    # Schematic SPICE simulation: in-process libngspice binding (no ngspice CLI).
    "PySpice>=1.5,<2.0.0",
    # XFA / AF dynamic-form extraction: read LiveCycle XFA packets from the PDF.
    "pikepdf>=10.0.0,<11.0.0",
    "fastapi[standard]>=0.139.2,<0.140.0",
    "httpx~=0.28",
    "pydantic~=2.10",
    "pydantic-settings~=2.4",
    "python-multipart>=0.0.14,<0.1.0",
    # docling-core 2.87.1 requires Typer <0.25.
    "typer>=0.24.2,<0.25.0",
    "uvicorn[standard]>=0.51.0,<1.0.0",
    "websockets>=16.1.1,<17.0",
    "scalar-fastapi>=1.0.3",
    "docling-mcp>=1.0.0",
    "opentelemetry-api>=1.44.0,<2.0.0",
    "opentelemetry-sdk>=1.44.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.44.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    "opentelemetry-exporter-prometheus>=0.65b0,<0.66",
    "prometheus-client>=0.21.0",
    "opencv-python>=5.0.0.93,<6.0.0",
    "boto3>=1.43.51",
    "PyJWT[crypto]>=2.10.1,<3.0.0",
    # docling-jobkit 2.1.0 caps redis-py below 8.
    "redis>=7.4.1,<8.0.0",
]

[project.optional-dependencies]
ui = [
    "gradio>=6.20.0,<7.0.0",
]
tesserocr = [
    "tesserocr~=2.7"
]
easyocr = [
    "easyocr>=1.7",
]
rapidocr = [
    "rapidocr (>=3.3,<4.0.0)",
    "onnxruntime (>=1.7.0,<2.0.0)",
]
flash-attn = [
  "flash-attn~=2.8.2; sys_platform == 'linux'"
]

[dependency-groups]
dev = [
    "asgi-lifespan~=2.0",
    # Architecture graph + non-regression ratchet.
    "graphifyy==0.9.20",
    # NumPy 2.5 requires Python 3.12; retain the latest marker-compatible line
    # while this package supports Python 3.10 and 3.11.
    "numpy<2.5.0",
    "httpx",
    "pydantic",
    "pydantic-settings",
    # mypy 2 exposes 50 upstream/plugin typing regressions; retain latest 1.x
    # until Docling Graph/Ray/Pydantic typing is compatible.
    "mypy>=1.20.2,<2.0.0",
    "pre-commit-uv~=4.1",
    "pypdf>=6.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-check~=2.4",
    "python-semantic-release>=10.6.1,<11.0.0",
    "ruff>=0.15.22",
    "types-psutil>=7.2.2.20260130",
    "types-pyyaml>=6.0.12.20250915",
]

pypi = [
  "torch>=2.13.0",
  "torchvision>=0.28.0",
]

cpu = [
  "torch>=2.12.1,<2.13.0",
  "torchvision>=0.27.1,<0.28.0",
  # Linux x86_64
  # torchvision/uv issue https://github.com/astral-sh/uv/issues/16386#issuecomment-3726000085
  "torchvision!=0.24.1,!=0.24.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# cu124 = [
#   "torch>=2.6.0",
#   "torchvision>=0.21.0",
# ]

cu126 = [
  "torch>=2.12.1,<2.13.0",
  "torchvision>=0.27.1,<0.28.0",
]

cu128 = [
  "torch>=2.11.0,<2.12.0",
  "torchvision>=0.26.0,<0.27.0",
]

cu130 = [
  "torch>=2.12.1,<2.13.0",
  "torchvision>=0.27.1,<0.28.0",
]
rocm = [
  # The ROCm 6.3 index currently publishes through this matched pair.
  "torch>=2.9.1,<2.10.0",
  "torchvision>=0.24.1,<0.25.0",
  "pytorch-triton-rocm>=3.3.1 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

rocm72 = [
    "torch>=2.12.1,<2.13.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision>=0.27.1,<0.28.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-rocm ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops"]

[tool.uv]
package = true
default-groups = ["dev", "pypi"]
conflicts = [
  [
    { group = "pypi" },
    { group = "cpu" },
    # { group = "cu124" },
    { group = "cu126" },
    { group = "cu128" },
    { group = "cu130" },
    { group = "rocm" },
    { group = "rocm72" },
  ],
]
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]
override-dependencies = [
  "urllib3~=2.0",
  "xgrammar>=0.1.24",
  "grpcio>=1.75.1",
  "cryptography>=46.0.7",
  # Exclude the FULL `docling` distribution everywhere (always-false marker). docling-jobkit
  # requires `docling-slim`, which owns the `docling/` namespace; docling-graph's declared
  # `docling` dependency would otherwise pull the full dist and conflict. The `docling`
  # namespace docling-graph imports is satisfied by docling-slim.
  "docling ; python_version < '0'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-pypi", group = "pypi" },
  { index = "pytorch-cpu", group = "cpu" },
  # { index = "pytorch-cu124", group = "cu124", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", group = "cu126", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", group = "cu128", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu130", group = "cu130", marker = "sys_platform == 'linux'" },
  { index = "pytorch-rocm", group = "rocm", marker = "sys_platform == 'linux'" },
  { index = "pytorch-rocm72", group = "rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

torchvision = [
  { index = "pytorch-pypi", group = "pypi" },
  { index = "pytorch-cpu", group = "cpu" },
  # { index = "pytorch-cu124", group = "cu124", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", group = "cu126", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", group = "cu128", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu130", group = "cu130", marker = "sys_platform == 'linux'" },
  { index = "pytorch-rocm", group = "rocm", marker = "sys_platform == 'linux'" },
  { index = "pytorch-rocm72", group = "rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

pytorch-triton-rocm = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]

triton-rocm = [
    { index = "pytorch-rocm72", group = "rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
]

# docling-slim = { git = "https://github.com/docling-project/docling/", rev = "main" }
# docling-jobkit = { git = "https://github.com/docling-project/docling-jobkit/", rev = "main" }
# docling-jobkit = { path = "../docling-jobkit", editable = true }

[[tool.uv.index]]
name = "pytorch-pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# [[tool.uv.index]]
# name = "pytorch-cu124"
# url = "https://download.pytorch.org/whl/cu124"
# explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.setuptools.packages.find]
include = ["docling_serve*"]
namespaces = true

[project.scripts]
docling-serve = "docling_serve.__main__:main"
docling-staging-smoke = "docling_serve.staging_smoke:main"

[project.urls]
Homepage = "https://github.com/docling-project/docling-serve"
# Documentation = "https://ds4sd.github.io/docling"
Repository = "https://github.com/docling-project/docling-serve"
Issues = "https://github.com/docling-project/docling-serve/issues"
Changelog = "https://github.com/docling-project/docling-serve/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py310"
line-length = 88
respect-gitignore = true

# extend-exclude = [
#     "tests",
# ]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    # "B",  # flake8-bugbear
    "C",  # flake8-comprehensions
    "C9",  # mccabe
    # "D",  # flake8-docstrings
    "E",  # pycodestyle errors (default)
    "F",  # pyflakes (default)
    "I",  # isort
    "PD", # pandas-vet
    "PIE", # pie
    # "PTH", # pathlib
    "Q",  # flake8-quotes
    # "RET", # return
    "RUF", # Enable all ruff-specific checks
    # "SIM", # simplify
    "S307", # eval
    # "T20",  # (disallow print statements) keep debugging statements out of the codebase
    "W",  # pycodestyle warnings
    "ASYNC", # async
    "UP", # pyupgrade
]

ignore = [
    "E501",  # Line too long, handled by ruff formatter
    "D107", # "Missing docstring in __init__",
    "F811", # "redefinition of the same function"
    "PL", # Pylint
    "RUF012", # Mutable Class Attributes
    "UP007", # Option and Union
]

#extend-select = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"tests/*.py" = ["ASYNC"] # Disable ASYNC check for tests

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort.sections]
"docling" = ["docling", "docling_core", "docling_jobkit"]

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = [
  "future",
  "standard-library",
  "third-party",
  "docling",
  "first-party",
  "local-folder",
]

[tool.mypy]
pretty = true
# strict = true
no_implicit_optional = true
plugins = "pydantic.mypy"
python_version = "3.12"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "easyocr.*",
    "tesserocr.*",
    "rapidocr_onnxruntime.*",
    "requests.*",
    "mlx_vlm.*",
    "mlx.*",
    "scalar_fastapi.*",
    "gradio.*",
    "msgpack.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
minversion = "8.2"
testpaths = [
    "tests",
]
addopts = "-rA --color=yes --tb=short --maxfail=5"
markers = [
"asyncio",
]

[tool.semantic_release]
# for default values check:
# https://github.com/python-semantic-release/python-semantic-release/blob/v7.32.2/semantic_release/defaults.cfg

version_source = "tag_only"
branch = "main"

# configure types which should trigger minor and patch version bumps respectively
# (note that they must be a subset of the configured allowed types):
parser_angular_allowed_types = "build,chore,ci,docs,feat,fix,perf,style,refactor,test"
parser_angular_minor_types = "feat"
parser_angular_patch_types = "fix,perf"
