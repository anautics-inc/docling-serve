# This example deployment configures Docling Serve with a Service and RQ workers

# Create following secret
# kubectl create secret generic docling-serve-rq-secrets --from-literal=REDIS_PASSWORD=myredispassword --from-literal=RQ_REDIS_URL=redis://:myredispassword@docling-serve-redis-service:6373/
---
apiVersion: v1
kind: Service
metadata:
  name: docling-serve
  labels:
    app: docling-serve
    component: docling-serve-api
spec:
  ports:
  - name: http
    port: 5001
    targetPort: http
  selector:
    app: docling-serve
    component: docling-serve-api
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: docling-serve
  labels:
    app: docling-serve
    component: docling-serve-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling-serve
      component: docling-serve-api
  template:
    metadata:
      labels:
        app: docling-serve
        component: docling-serve-api
    spec:
      restartPolicy: Always
      serviceAccountName: docling-serve-api
      containers:
        - name: api
          resources:
            limits:
              cpu: 1
              memory: 8Gi
              ephemeral-storage: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
              ephemeral-storage: 1Gi
          env:
            - name: DOCLING_SERVE_UPLOAD_STAGING_MODE
              value: required
            - name: DOCLING_SERVE_UPLOAD_STAGING_BUCKET
              value: DOCLING_STAGING_BUCKET_PLACEHOLDER
            - name: DOCLING_SERVE_UPLOAD_STAGING_REGION
              value: DOCLING_STAGING_REGION_PLACEHOLDER
            - name: DOCLING_SERVE_UPLOAD_STAGING_KMS_KEY_ID
              value: DOCLING_STAGING_KMS_KEY_PLACEHOLDER
            - name: DOCLING_SERVE_ENABLE_UI
              value: 'true'
            - name: DOCLING_SERVE_ENG_KIND
              value: 'rq'
            - name: DOCLING_SERVE_ENG_RQ_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: docling-serve-rq-secrets
                  key: RQ_REDIS_URL
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          imagePullPolicy: IfNotPresent
          # Render with scripts/render_deploy_example.py before applying.
          image: 'DOCLING_SERVE_IMAGE_PLACEHOLDER'
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: docling-serve-rq-workers
  labels:
    app: docling-serve-rq-workers
    component: docling-serve-rq-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docling-serve-rq-workers
      component: docling-serve-rq-worker
  template:
    metadata:
      labels:
        app: docling-serve-rq-workers
        component: docling-serve-rq-worker
    spec:
      restartPolicy: Always
      serviceAccountName: docling-serve-worker
      containers:
        - name: worker
          resources:
            limits:
              cpu: 1
              memory: 4Gi
              ephemeral-storage: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
              ephemeral-storage: 1Gi
          env:
            - name: DOCLING_SERVE_UPLOAD_STAGING_MODE
              value: required
            - name: DOCLING_SERVE_UPLOAD_STAGING_BUCKET
              value: DOCLING_STAGING_BUCKET_PLACEHOLDER
            - name: DOCLING_SERVE_UPLOAD_STAGING_REGION
              value: DOCLING_STAGING_REGION_PLACEHOLDER
            - name: DOCLING_SERVE_UPLOAD_STAGING_KMS_KEY_ID
              value: DOCLING_STAGING_KMS_KEY_PLACEHOLDER
            - name: DOCLING_SERVE_ENG_KIND
              value: 'rq'
            - name: DOCLING_SERVE_ENG_RQ_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: docling-serve-rq-secrets
                  key: RQ_REDIS_URL
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          imagePullPolicy: IfNotPresent
          # Render with the same immutable digest as the API deployment.
          image: 'DOCLING_SERVE_IMAGE_PLACEHOLDER'
          command: ["docling-serve"]
          args: ["rq-worker"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-serve-redis
  labels:
    app: docling-serve-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling-serve-redis
  template:
    metadata:
      labels:
        app: docling-serve-redis
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 100Mi
          image: redis:7.4.9@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
          command: ["redis-server"]
          args:
            - "--port"
            - "6373"
            - "--dir"
            - "/mnt/redis/data"
            - "--appendonly"
            - "yes"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          ports:
            - containerPort: 6373
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docling-serve-rq-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /mnt/redis/data
          securityContext:
            fsGroup: 1004
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: redis-data
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: docling-serve-redis-service
  labels:
      app: docling-serve-redis
spec:
  type: NodePort
  ports:
    - name: redis-service
      protocol: TCP
      port: 6373
      targetPort: 6373
  selector:
    app: docling-serve-redis