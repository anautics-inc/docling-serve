# AMD ROCm deployment

services:
  docling-serve:
    # Set to an immutable digest built from this repository's Containerfile.
    image: ${DOCLING_SERVE_IMAGE:?Set DOCLING_SERVE_IMAGE to registry/repo@sha256:digest}
    container_name: docling-serve
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_UPLOAD_STAGING_MODE: "required"
      DOCLING_SERVE_UPLOAD_STAGING_BUCKET: "${DOCLING_SERVE_UPLOAD_STAGING_BUCKET:?required}"
      DOCLING_SERVE_UPLOAD_STAGING_REGION: "${AWS_REGION:?required}"
      DOCLING_SERVE_UPLOAD_STAGING_KMS_KEY_ID: "${DOCLING_SERVE_UPLOAD_STAGING_KMS_KEY_ID:?required}"
      DOCLING_SERVE_ENABLE_UI: "true"
      ROCR_VISIBLE_DEVICES: "0" # https://rocm.docs.amd.com/en/latest/conceptual/gpu-isolation.html#rocr-visible-devices
      ## This section is for compatibility with older cards
      # HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      # HSA_ENABLE_SDMA: "0"
      ## Enable experimental Flash/Mem-Efficient attention kernels on AMD GPU (aotriton).
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - 44    # video group GID from host
      - 992   # render group GID from host
    restart: always
