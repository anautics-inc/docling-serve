# NVIDIA CUDA deployment

services:
  docling-serve:
    # Set to an immutable digest built from this repository's Containerfile.
    image: ${DOCLING_SERVE_IMAGE:?Set DOCLING_SERVE_IMAGE to registry/repo@sha256:digest}
    container_name: docling-serve
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_UPLOAD_STAGING_MODE: "required"
      DOCLING_SERVE_UPLOAD_STAGING_BUCKET: "${DOCLING_SERVE_UPLOAD_STAGING_BUCKET:?required}"
      DOCLING_SERVE_UPLOAD_STAGING_REGION: "${AWS_REGION:?required}"
      DOCLING_SERVE_UPLOAD_STAGING_KMS_KEY_ID: "${DOCLING_SERVE_UPLOAD_STAGING_KMS_KEY_ID:?required}"
      DOCLING_SERVE_ENABLE_UI: "true"
      NVIDIA_VISIBLE_DEVICES: "all" # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/docker-specialized.html
    # deploy:  # This section is for compatibility with Swarm
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    runtime: nvidia
    restart: always
